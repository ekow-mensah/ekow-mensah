<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <text x="1130" y="235" text-anchor="end" font-size="190" font-weight="700" fill="#60a5fa" fill-opacity="0.07" class="mono">&lt;/&gt;</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(72,66)">
    <rect width="232" height="34" rx="17" fill="#2563eb" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.35"/>
    <circle class="dot" cx="20" cy="17" r="4" fill="#22c55e"/>
    <text x="34" y="22" font-size="14" font-weight="500" fill="#bfdbfe">Currently building WeGoo</text>
  </g>

  <text x="70" y="182" font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#name)">Ekow Mensah</text>
  <text x="74" y="228" font-size="22" fill="#94a3b8">Software Engineer  ·  APIs and Web Apps  ·  6+ years</text>
  <text x="74" y="270" font-size="14" fill="#64748b" class="mono">UK-based  ·  from Ghana  ·  MSc Advanced CS, Loughborough</text>
</svg>
